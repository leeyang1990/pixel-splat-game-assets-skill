<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 场景集</title>
</head>
<body>
  <a href="../">打开场景集 · Open the scene gallery</a>
  <script>
    const scenes = new Map([
      ['lone-guardian', 'liberty-island'],
      ['deep-sea', 'pearl-harbor'],
      ['sun-temple', 'tulum'],
      ['mirage', 'black-forest'],
    ]);
    const gallery = new URL('../', location.href);
    gallery.search = location.search;
    gallery.hash = scenes.get(location.hash.slice(1)) || '';
    location.replace(gallery);
  </script>
</body>
</html>
